services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${NOTIFICATION_SERVICE_NAME}
    image: mumulbo/mmb-notification-service:IMAGE_TAG_PLACEHOLDER
    env_file:
      - .env
    ports:
      - "${SERVICE_PORT}:8087"
      - "5005:5005"
    networks:
      - external-net
    depends_on:
      - mongo
      - kafka
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis-notification:
    image: redis:7.2
    container_name: ${NOTIFICATION_SERVICE_NAME}-redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: redis-server --port 6381
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    networks:
      - external-net

  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: mmb-zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - external-net

  kafka:
    image: bitnami/kafka:3.6
    container_name: mmb-kafka
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    networks:
      - external-net

  mongo:
    image: mongo:6.0
    container_name: ${NOTIFICATION_SERVICE_NAME}-mongo
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'
    networks:
      - external-net

volumes:
  mysql_data:
  mongo_data:

networks:
  external-net:
    external: true
    name: ${MMB_DOCKER_NETWORK}
